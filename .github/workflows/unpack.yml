name: Unpack project
on:
  push:
    paths: ["lunanest.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f lunanest.zip
          unzip -o lunanest.zip
          rm lunanest.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack LunaNest project"
          git push
          
